<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RT MODS ADMIN PANEL</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #131822;
      --accent-color: #00f2fe;
      --btn-purple: #7000ff;
      --btn-green: #00e676;
      --text-color: #ffffff;
      --border-color: #212936;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.1);
      text-align: center;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      color: #ff3366;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 15px;
    }

    /* Plan Selection List */
    .plan-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .plan-item {
      background: #0b0e14;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .plan-item.active {
      border-color: var(--accent-color);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }

    .plan-info {
      font-size: 15px;
      font-weight: bold;
    }

    .radio-circle {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
    }

    .plan-item.active .radio-circle {
      border-color: var(--accent-color);
      background-color: var(--accent-color);
    }

    .qr-box {
      background: #ffffff;
      padding: 12px;
      border-radius: 12px;
      display: inline-block;
      margin: 15px 0;
    }

    .qr-box img {
      width: 180px;
      height: 180px;
      display: block;
    }

    .upi-container {
      background: #0b0e14;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .upi-id {
      font-family: monospace;
      font-size: 14px;
      color: #e6edf3;
    }

    .copy-btn {
      background: #1f6beb;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .instructions {
      text-align: left;
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .pay-btn {
      width: 100%;
      background: var(--btn-green);
      color: #000;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .telegram-btn {
      display: inline-block;
      margin-top: 15px;
      color: var(--accent-color);
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Brand Title -->
    <div class="brand-title">RT MODS ADMIN PANEL</div>

    <!-- Select Plan Section -->
    <div class="section-title">SELECT PLAN</div>
    <div class="plan-list">
      <div class="plan-item active" onclick="selectPlan('1 HOURS', 30, this)">
        <span class="plan-info">⚡ 1 HOURS — ₹30</span>
        <div class="radio-circle"></div>
      </div>
      <div class="plan-item" onclick="selectPlan('3 HOURS', 70, this)">
        <span class="plan-info">⚡ 3 HOURS — ₹70</span>
        <div class="radio-circle"></div>
      </div>
      <div class="plan-item" onclick="selectPlan('6 HOURS', 130, this)">
        <span class="plan-info">⚡ 6 HOURS — ₹130</span>
        <div class="radio-circle"></div>
      </div>
    </div>

    <!-- Payment Details -->
    <div class="section-title">💳 SCAN & PAY</div>

    <!-- QR Code -->
    <div class="qr-box">
      <img id="qr-image" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=6295268685@fam&pn=RTMODS&am=30" alt="UPI QR Code">
    </div>

    <!-- UPI Copy Section -->
    <div class="upi-container">
      <span class="upi-id" id="upi-text">6295268685@fam</span>
      <button class="copy-btn" onclick="copyUPI()">COPY</button>
    </div>

    <!-- Instructions -->
    <div class="instructions">
      1. Scan QR or copy UPI ID<br>
      2. Pay exact amount (<span id="pay-amount">₹30</span>)<br>
      3. Save your Transaction ID (UTR)
    </div>

    <!-- Confirm Button -->
    <button class="pay-btn" onclick="alert('পেমেন্ট কনফার্মেশনের জন্য টেলিগ্রামে মেসেজ দিন।')">
      ✅ I HAVE PAID – NEXT
    </button>

    <!-- Telegram Link -->
    <br>
    <a href="https://t.me/Rtmods" target="_blank" class="telegram-btn">📱 Contact on Telegram: @Rtmods</a>
  </div>

  <script>
    let currentAmount = 30;
    const upiId = "6295268685@fam";

    function selectPlan(hours, amount, element) {
      document.querySelectorAll('.plan-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');
      currentAmount = amount;
      
      document.getElementById('pay-amount').innerText = "₹" + amount;
      
      // Dynamic QR Code Update
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=${upiId}&pn=RTMODS&am=${amount}`;
      document.getElementById('qr-image').src = qrUrl;
    }

    function copyUPI() {
      navigator.clipboard.writeText(upiId);
      alert("UPI ID Copied: " + upiId);
    }
  </script>

</body>
</html>
